site_name: CuTile Python From First Principles — Under Development
site_description: Writing Portable, Tile-Based GPU Kernels in NVIDIA cuTile Python, One Layer at a Time
site_author: Oluwaseyi Awoga
copyright: Copyright &copy; 2026 Oluwaseyi Awoga

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/grid

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - "Part 0 — cuTile Foundations":
      - "1. Arrays, Tiles, and the Kernel Boundary": part0/01-arrays-tiles-and-the-kernel-boundary.md
      - "2. Kernel Parameterization": part0/02-kernel-parameterization.md
      - "3. Tiled Views, Shape, and Memory Layout": part0/03-tiled-views-shape-and-memory-layout.md
      - "4. The cuTile Programming Model": part0/04-the-cutile-programming-model.md
      - "5. Targeting Hardware and Ahead-of-Time Compilation": part0/05-targeting-hardware-and-ahead-of-time-compilation.md
  - "Part 1 — Kernel-Array Interface":
      - "6. The Array-Tile Contract": part1/06-the-array-tile-contract.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/maximumbeings
