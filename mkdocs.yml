site_name: CuTile Python From First Principles — Under Development
site_description: Writing Portable, Tile-Based GPU Kernels in NVIDIA cuTile Python, One Layer at a Time
site_author: Oluwaseyi Awoga
copyright: Copyright &copy; 2026 Oluwaseyi Awoga

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/grid

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - "Part 0 — cuTile Foundations":
      - "1. Arrays, Tiles, and the Kernel Boundary": part0/01-arrays-tiles-and-the-kernel-boundary.md
      - "2. Kernel Parameterization": part0/02-kernel-parameterization.md
      - "3. Tiled Views, Shape, and Memory Layout": part0/03-tiled-views-shape-and-memory-layout.md
      - "4. The cuTile Programming Model": part0/04-the-cutile-programming-model.md
      - "5. Targeting Hardware and Ahead-of-Time Compilation": part0/05-targeting-hardware-and-ahead-of-time-compilation.md
  - "Part 1 — Kernel-Array Interface":
      - "6. The Array-Tile Contract": part1/06-the-array-tile-contract.md
      - "7. Divisibility and Alignment Hints": part1/07-divisibility-and-alignment-hints.md
      - "8. Masking, Padding, and Rounding Modes": part1/08-masking-padding-and-rounding-modes.md
      - "9. The Memory Model": part1/09-the-memory-model.md
      - "10. Compiler Hints and Autotuning": part1/10-compiler-hints-and-autotuning.md
  - "Part 2 — Composing Kernels":
      - "11. Composing Kernels: Tile Functions and Inlining": part2/11-composing-kernels-tile-functions-and-inlining.md
      - "12. Symbol Names and Multi-Kernel Artifacts": part2/12-symbol-names-and-multi-kernel-artifacts.md
      - "13. Multi-Pass Kernels: Loops and Traversal": part2/13-multi-pass-kernels-loops-and-traversal.md
      - "14. Runtime Tuples and Lists: Finishing the Parameter Surface": part2/14-tuples-lists-and-the-parameter-surface.md
      - "15. Reshaping and Recombining Tiles": part2/15-reshaping-and-recombining-tiles.md
      - "16. Scans, Reductions, and a Second Confound": part2/16-scans-reductions-and-a-second-confound.md
      - "17. Elementwise Math and the Limits of Rounding Mode": part2/17-elementwise-math-and-the-limits-of-rounding-mode.md
      - "18. Comparisons, Where, and the Limits of a Tile Condition": part2/18-comparisons-where-and-the-limits-of-a-tile-condition.md
      - "19. Bitwise Operations and a Docstring That Overpromises": part2/19-bitwise-operations-and-a-docstring-that-overpromises.md
      - "20. Atomics and Memory Another Block Might Be Touching": part2/20-atomics-and-memory-another-block-might-be-touching.md
      - "21. Matrix Multiplication and the Limits of sm_90": part2/21-matrix-multiplication-and-the-limits-of-sm_90.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/maximumbeings
